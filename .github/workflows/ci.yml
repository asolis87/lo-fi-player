name: ci

# Workflow stub for the lo-fi-player repository.
#
# PR #0 ships this file as a *contract* for the upcoming Go pipeline. The
# `go test` / `go build` steps will fail with a clear "no main module"
# message until PR #1 introduces `go.mod`. Once the module is in place,
# the same workflow becomes the canonical CI gate for every chained PR.
# PR #1 adds Go module + build cache so chained PRs rebuild incrementally.

on:
  push:
    branches:
      - feat/lo-fi-player
      - feat/pr-*
  pull_request:
    branches:
      - feat/lo-fi-player

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # cache: true is a no-op when no Go module exists, so the
          # workflow stays safe for the stack-agnostic bootstrap path.
          cache: true

      - name: cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-build-

      # `oto/v3` ships a cgo binding against ALSA (`driver_unix.go` runs
      # `pkg-config --cflags alsa`). The Ubuntu runner does not ship the
      # ALSA development headers by default, so the cgo compile of
      # `internal/audio` (transitively) fails with
      # "Package alsa was not found in the pkg-config search path."
      # Install the headers + pkg-config once per run; this is a
      # ~30 s cost in exchange for the procedural backend actually
      # producing sound.
      - name: install ALSA dev headers (oto/v3 cgo)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: go vet
        run: go vet ./...
        # `go vet ./...` is intentionally present even though PR #0 ships
        # without a Go module: it pins the expected analyzer behaviour
        # so PR #1 cannot accidentally relax vet rules.

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
